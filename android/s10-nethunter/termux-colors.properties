# Matrix palette for the Termux app.
# Copy to  ~/.termux/colors.properties  (in TERMUX, not the chroot),
# then run:  termux-reload-settings
#
# Also worth setting in ~/.termux/termux.properties:
#   extra-keys = [['ESC','/','-','HOME','UP','END','PGUP'],['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]

background=#000600
foreground=#00ff41
cursor=#00ff41

# 16-color ANSI — greens with red/amber reserved for warnings
color0=#0a0f0a
color1=#ff5555
color2=#00ff41
color3=#9dff4d
color4=#1f9c47
color5=#39ff88
color6=#54ff81
color7=#c8ffd4
color8=#1f9c47
color9=#ff5555
color10=#00ff41
color11=#9dff4d
color12=#39ff88
color13=#54ff81
color14=#7dffb0
color15=#e6ffe6
